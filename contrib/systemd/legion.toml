# Legion daemon configuration for the packaged systemd service.
# Prefer LEGION_API_KEY in legion.env rather than putting secrets here.
# api_key = "replace-with-a-long-random-token"
# Distributed builds use hiqlite for both solo and multi-node operation.
# Configure a unique raft_node_id and routable raft_addr/raft_api_addr on each
# node. Peers can be listed explicitly with [[raft_peers]] or discovered from
# the same values advertised through mDNS.
raft_node_id = 1
raft_addr = "0.0.0.0:17001"
raft_api_addr = "0.0.0.0:17002"
raft_secret = "replace-with-a-shared-raft-secret"
raft_api_secret = "replace-with-a-shared-api-secret"

[cluster]
data_dir = "/var/lib/legion"
bind_addr = "0.0.0.0:0"
api_port = 8080
mdns = true

[model]
default_model = "anthropic/claude-haiku-3-5"
system_prompt = "You are a Legion cluster agent."

[invocation]
timeout_ms = 30000
max_input_bytes = 1048576
max_output_bytes = 4194304
max_concurrent_per_function = 8
max_requests_per_window = 120
rate_window_ms = 60000

[session_rate_limit]
max_requests_per_window = 30
window_ms = 60000
