[workspace]
members = [
    "crates/legion-core",
    "crates/legion-store",
    "crates/legion-loop",
    "crates/legion-namespace",
    "crates/legion-cluster",
    "crates/legion-runtime",
    "crates/legion-deploy",
    "crates/legion-server",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/rcarmo/legion"
rust-version = "1.95"

[workspace.dependencies]
base64      = "0.22"
# Core async
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
futures     = "0.3"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# Error handling
thiserror   = "2"
anyhow      = "1"

# Tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# LLM
rs-ai = { path = "../../rs-ai", default-features = false }

# HTTP
axum       = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest    = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
clap       = { version = "4", features = ["derive", "env"] }

# Storage – single-node
rusqlite = { version = "0.40", features = ["bundled"] }

# Storage – distributed (Milestone 1+)
hiqlite = { version = "0.14", default-features = false, features = ["sqlite", "macros", "auto-heal", "listen_notify_local", "dlock"] }

# P2P networking (Milestone 1+)
iroh                     = "1"
iroh-blobs               = "0.103"
iroh-gossip              = "0.101"
iroh-mdns-address-lookup = "0.5"
mdns-sd                  = "0.21"

# 9P namespace (Milestone 2+)
jetstream_9p = "16"

# WASM runtime (Milestone 3+)
wasmtime = { version = "48", features = ["cranelift", "component-model"] }
extism   = "1"

# Utilities
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }
sha2    = "0.10"
blake3  = "1"
bytes   = "1"
rand    = "0.8"

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
