<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Legion Web Chat</title><style>body{font:16px system-ui;max-width:50rem;margin:2rem auto;padding:0 1rem;background:#0b1020;color:#eef}#log{min-height:20rem;border:1px solid #345;padding:1rem;white-space:pre-wrap}form{display:flex;margin-top:1rem}input{flex:1;padding:.8rem}button{padding:.8rem}</style></head><body><h1>Legion Web Chat</h1><div id="log"></div><form><input autofocus placeholder="Message"><button>Send</button></form><script>const log=document.querySelector('#log'),input=document.querySelector('input'),ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>{const m=JSON.parse(e.data);log.textContent+=`Legion: ${m.text}\n`};document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!input.value)return;log.textContent+=`You: ${input.value}\n`;ws.send(JSON.stringify({text:input.value}));input.value=''}</script></body></html>
