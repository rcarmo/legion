<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legion Dashboard</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151c30;--line:#29334e;--text:#e8edf8;--muted:#91a0bd;--accent:#65d6ad;--warn:#ffcc66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{display:flex;gap:1rem;align-items:center;padding:1rem 1.4rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(8px)}h1{font-size:1.25rem;margin:0}header span{color:var(--accent)}header input{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:.5rem;width:16rem}button{background:var(--accent);color:#07110e;border:0;border-radius:6px;padding:.52rem .8rem;font-weight:700;cursor:pointer}main{display:grid;grid-template-columns:16rem 1fr;min-height:calc(100vh - 61px)}nav{padding:1rem;border-right:1px solid var(--line)}nav button{display:block;width:100%;margin:.25rem 0;text-align:left;background:transparent;color:var(--muted)}nav button.active{background:var(--panel);color:var(--accent)}section{padding:1.2rem;overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.8rem;margin-bottom:1rem}.card,table,pre{background:var(--panel);border:1px solid var(--line);border-radius:8px}.card{padding:1rem}.metric{font-size:2rem;color:var(--accent)}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{text-align:left;padding:.7rem;border-bottom:1px solid var(--line)}th{color:var(--muted)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#1d2741}pre{padding:1rem;white-space:pre-wrap;max-height:28rem;overflow:auto;color:#c9d5ef}.status{color:var(--warn)}.error{color:#ff7b8b;padding:.8rem}.muted{color:var(--muted)}@media(max-width:700px){main{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{min-width:8rem}header input{width:9rem}}
</style></head><body><header><h1><span>Legion</span> Dashboard</h1><div id="health" class="muted">connecting…</div><input id="key" type="password" placeholder="API key (stored locally)"><button id="refresh">Refresh</button></header><main><nav id="nav"><button data-view="sessions" class="active">Sessions</button><button data-view="agents">Agents</button><button data-view="functions">Functions</button><button data-view="workflows">Workflow runner</button><button data-view="cluster">Cluster</button></nav><section id="content"></section></main>
<script>
const $=s=>document.querySelector(s), content=$('#content'), key=$('#key'); key.value=localStorage.legionApiKey||''; key.onchange=()=>localStorage.legionApiKey=key.value;
let view='sessions'; async function api(path,init={}){const h=new Headers(init.headers);if(key.value)h.set('authorization','Bearer '+key.value);if(init.body)h.set('content-type','application/json');const r=await fetch(path,{...init,headers:h});const v=await r.json();if(!r.ok)throw Error(v.error||r.statusText);return v}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const status=v=>esc(typeof v==='object'?(v.status||JSON.stringify(v)):v);
async function sessions(){const v=await api('/sessions?limit=100');content.innerHTML=`<h2>Sessions</h2><div class="cards"><div class="card"><div class="metric">${v.sessions.length}</div><div class="muted">recent sessions</div></div><div class="card"><div class="metric">${v.sessions.filter(s=>s.status?.status==='running').length}</div><div class="muted">running</div></div></div><table><thead><tr><th>Run ID</th><th>Status</th><th>Model</th><th>Turns</th><th>Updated</th></tr></thead><tbody>${v.sessions.map(s=>`<tr data-id="${esc(s.run_id)}"><td>${esc(s.run_id)}</td><td class="status">${status(s.status)}</td><td>${esc(s.model)}</td><td>${s.turns}</td><td>${new Date(s.updated_at).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;content.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>session(r.dataset.id))}
async function session(id){const [s,l]=await Promise.all([api('/sessions/'+id),api('/sessions/'+id+'/log')]);content.innerHTML=`<button onclick="render()">← Sessions</button><h2>${esc(id)}</h2><div class="card"><b>Status:</b> ${status(s.status)}</div><h3>Event log</h3><pre>${esc(JSON.stringify(l.entries,null,2))}</pre>`}
async function agents(){const v=await api('/agents');content.innerHTML=`<h2>Agent profiles</h2><table><thead><tr><th>Name</th><th>Description</th><th>Model</th><th>Tools</th></tr></thead><tbody>${v.agents.map(a=>`<tr><td>agent.${esc(a.name)}</td><td>${esc(a.description)}</td><td>${esc(a.config.model)}</td><td>${esc((a.config.tools||[]).join(', '))}</td></tr>`).join('')}</tbody></table>`}
async function functionsView(){const v=await api('/functions');content.innerHTML=`<h2>Functions</h2><pre>${esc(JSON.stringify(v.functions,null,2))}</pre>`}
async function cluster(){const v=await api('/cluster/peers');content.innerHTML=`<h2>Cluster</h2><div class="cards"><div class="card"><b>Self</b><pre>${esc(JSON.stringify(v.self,null,2))}</pre></div><div class="card"><div class="metric">${v.peers.length}</div><div class="muted">peers</div></div></div><pre>${esc(JSON.stringify(v.peers,null,2))}</pre>`}
async function workflows(){content.innerHTML=`<h2>Workflow runner</h2><p class="muted">Submit a validated DAG. Dependency outputs are injected into each node's <code>dependencies</code> argument.</p><textarea id="graph" style="width:100%;height:15rem;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:1rem">{"nodes":[{"id":"first","tool":"cluster.status","args":{}},{"id":"peers","tool":"cluster.peers","depends_on":["first"]}]}</textarea><p><button id="run">Run workflow</button></p><pre id="result">Ready.</pre>`;$('#run').onclick=async()=>{$('#result').textContent='Running…';try{$('#result').textContent=JSON.stringify(await api('/workflows/run',{method:'POST',body:$('#graph').value}),null,2)}catch(e){$('#result').textContent=e.message}}}
async function render(){content.innerHTML='<p class="muted">Loading…</p>';try{await ({sessions,agents,functions:functionsView,workflows,cluster}[view])()}catch(e){content.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
$('#nav').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b===e.target));render()}};$('#refresh').onclick=render;api('/health').then(v=>$('#health').textContent='v'+v.version+' · healthy').catch(()=>$('#health').textContent='offline');render();
</script></body></html>
