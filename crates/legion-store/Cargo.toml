[package]
name        = "legion-store"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[features]
# Enable the hiqlite-backed distributed store (requires a running Raft cluster)
distributed = ["hiqlite"]

[dependencies]
legion-core = { path = "../legion-core" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
sha2        = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
rusqlite    = { workspace = true }
hiqlite     = { workspace = true, optional = true }

[[test]]
name = "distributed_failover"
path = "tests/distributed_failover.rs"
required-features = ["distributed"]

[[test]]
name = "hiqlite_load"
path = "tests/hiqlite_load.rs"
required-features = ["distributed"]

[dev-dependencies]
tempfile = "3"
